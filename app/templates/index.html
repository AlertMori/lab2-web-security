{% extends "base.html" %}
{% block content %}
<h1>Гостевая книга</h1>

<form method="post" action="{{ url_for('comment') }}">
  <input name="author" placeholder="Имя">
  <textarea name="body" placeholder="Сообщение" rows="3"></textarea>
  <button type="submit">Отправить</button>
</form>

<hr>

{% for c in comments %}
  <div class="comment">
    <b>{{ c.author }}</b>:
    {# VULN 2 (Stored XSS): тело комментария выводится фильтром | safe,     #}
    {# то есть без экранирования. Любой <script> из БД выполнится в браузере. #}
    {{ c.body | safe }}
  </div>
{% endfor %}
{% endblock %}
